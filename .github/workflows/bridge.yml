name: Telegram GitHub Relay

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read      # this PUBLIC repo now holds code only
  actions: write      # lets the relay queue its own next run (unchanged)

concurrency:
  group: telegram-github-relay-2
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      # 1) the relay CODE comes from this public repo
      - name: Checkout relay code (public repo)
        uses: actions/checkout@v4
        with:
          path: code

      # 2) all DATA (signals / outbox / commands / control / heartbeat / bridge state) lives in a PRIVATE repo.
      #    DATA_REPO_PAT = fine-grained token limited to that one repo, Contents: Read and write.
      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: mahdi7445/TIC2NBTX-data
          token: ${{ secrets.DATA_REPO_PAT }}
          ref: main
          fetch-depth: 0
          path: data

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bridge dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r code/telegram-github-bridge/requirements.txt

      - name: Run Telegram GitHub relay
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          # Same key as USER_VAULT_MASTER_KEY in the Windows .env: encrypts a subscriber's
          # API key/secret BEFORE it is written to the data repo. Without it the
          # bridge refuses /connect entirely (never falls back to plaintext).
          USER_VAULT_MASTER_KEY: ${{ secrets.USER_VAULT_MASTER_KEY }}
          BRIDGE_RUNTIME_SECONDS: "275"
          TELEGRAM_LONG_POLL_SECONDS: "1"
          MAX_RELAY_LINES: "5000"
          PUSH_MIN_INTERVAL_SECONDS: "0.5"
          PULL_MIN_INTERVAL_SECONDS: "1.5"
          # Lets bridge.py queue its own next run (workflow_dispatch) instead of
          # depending only on the 5-minute cron above, which this repo's own
          # Actions history shows firing anywhere from minutes to several hours
          # apart. github.token already has actions:write from the permissions
          # block above, so no extra secret/PAT is needed.
          GH_DISPATCH_TOKEN: ${{ github.token }}
          BRIDGE_WORKFLOW_FILE: "bridge.yml"
        working-directory: data
        run: |
          python ../code/telegram-github-bridge/bridge.py
